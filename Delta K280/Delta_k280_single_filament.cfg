
# This file contains common pin mappings for MKS Robin Nano V3
# boards. To use this config, the firmware should be compiled for the
# stm32f407. When running "make menuconfig", select the 48KiB
# bootloader, and enable "USB for communication".

# The "make flash" command does not work on the MKS Robin. Instead,
# after running "make", copy the generated "out/klipper.bin" file to a
# file named "Robin_nano_v3.bin" on an SD card and then restart the
# MKS Robin with that SD card.

# See docs/Config_Reference.md for a description of parameters.
[include fluidd.cfg]

#[include resonancias.cfg]

# Incluye la macro para calentar la impresora, iniciar la purga con 2 lineas, reiniciar el extrusor e iniciar la impresion
[include macros/START_PRINT.cfg]
[include macros/END_PRINT.cfg]

#[include macros/TEST_SPEED_DELTA.cfg]

#[include macros/FILAMENT_LOAD_UNLOAD.cfg]
#[include macros/TOOL_CHANGE_EXTRUDER.cfg]

[include macros/DELTA_CALIBRACION.cfg]

[include macros/CALIBRATE_BED_MESH_PROBE.cfg]

# Inactivo por el momento hasta testing
#[include macros/EXTRA_TOOLS.cfg]

#[include macros/TEST_LED.cfg]
#[include macros/LEDS.cfg]
[include macros/LED_PLUGIN.cfg]

[stepper_a]
step_pin: PE3
dir_pin: PE2
enable_pin: !PE4
microsteps: 16
rotation_distance: 40
endstop_pin: !PA15
homing_speed: 50
position_endstop: 297.05
arm_length: 335.0

[stepper_b]
step_pin: PE0
dir_pin: PB9
enable_pin: !PE1
microsteps: 16
rotation_distance: 40
endstop_pin: !PD2

[stepper_c]
step_pin: PB5
dir_pin: PB4
enable_pin: !PB8
microsteps: 16
rotation_distance: 40
endstop_pin: !PC8

[extruder]
step_pin: PD6
dir_pin: PD3
enable_pin: !PB3
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB4
sensor_type: ATC Semitec 104GT-2
sensor_pin: PK5
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250
min_extrude_temp: 10
max_extrude_only_distance: 1000
max_extrude_cross_section: 1000

[heater_bed]
heater_pin: PH5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK6
control: watermark
min_temp: 0
max_temp: 110

[probe]
pin: ^!gpio16
#pin: ^!gpio22
z_offset:  0.3#1.65
y_offset: 0#-30.00
x_offset:  0#25.00
speed: 10
samples: 3
sample_retract_dist: 10.0 # samples: 1
samples_result: median
#samples_result: average

[bed_mesh]
speed: 50                     # Speed for non-probing moves (default is fine)
horizontal_move_z: 10          # Height to move to before probing
mesh_radius: 125              # Radius of the mesh for round beds (matches your bed size)
mesh_origin: 0, 0             # Center of the mesh (relative to the probe)
round_probe_count: 7          # Number of points along the radius (higher for better accuracy)
fade_start: 0.5               # Start fading out Z-adjustment at this height
fade_end: 10.0                # Complete fading out at this height
fade_target: 0                # Converge fade to Z = 0 (homing position)
split_delta_z: 0.025          # Split moves if Z difference exceeds this value
move_check_distance: 10.0      # Distance to check for Z splits
mesh_pps: 10, 10                # Points per segment for interpolation
algorithm: bicubic            # Use bicubic interpolation for smoother transitions
bicubic_tension: 0.2          # Tension for bicubic interpolation (default is fine)
zero_reference_position: 0, 0 # Set Z = 0 at the center of the bed

[endstop_phase]

[input_shaper]

[mcu]
serial: /dev/ttyACM0

#Configuracion de MKS Robin Nano V3
[printer]
kinematics: delta
max_velocity: 300
max_accel: 1500
max_z_velocity: 15
delta_radius: 179.34

#Configuracion de SKR Pico
[printer]
kinematics: delta

#Nuevas:
#max_velocity: 250
max_accel: 1500
#max_z_velocity: 250

#Anteriores:
max_velocity: 500
#max_accel: 2500
max_z_velocity: 500
#max_z_accel: 1500
max_z_accel: 500

#delta_radius: 178.75
minimum_z_position:-5

[delta_calibrate]
radius: 50

#Configuracion de SKR Pico
#[delta_calibrate]
#radius: 125
#speed: 10
#horizontal_move_z: 10

########################################
# TMC UART configuration
########################################

[tmc2209 stepper_a]
uart_pin: PD5
run_current: 0.75
stealthchop_threshold: 999999

[tmc2209 stepper_b]
uart_pin: PD7
run_current: 0.9
stealthchop_threshold: 999999

[tmc2209 stepper_c]
uart_pin: PD4
run_current: 0.6
stealthchop_threshold: 999999

[tmc2209 extruder]
uart_pin: PD9
run_current: 0.3
sense_resistor: 0.110
stealthchop_threshold: 999999

[gcode_macro CALCULATE_BED_MESH]
description: Calculate bed_mesh boundaries automatically based on your bltouch/probe config
gcode:
  {% set BED_MESH_MARGIN = params.BED_MESH_MARGIN|default(10)|float %}
  # Get Printer built volume dimensions
  {% set X_MAX = printer.toolhead.axis_maximum.x|default(230)|float %}
  {% set Y_MAX = printer.toolhead.axis_maximum.y|default(230)|float %}
  # Get Nothing/BLTouch/Probe X and Y offsets
  {% set X_OFFSET = 0.0 |float %}
  {% set Y_OFFSET = 0.0 |float %}
  #Get BLTouch/Probe X and Y offsets
  {% if printer.configfile.config["bltouch"] is defined %}
    {% set X_OFFSET = (printer.configfile.settings.bltouch.x_offset if printer.configfile.settings.bltouch.x_offset is defined else X_OFFSET)|float %}
    {% set Y_OFFSET = (printer.configfile.settings.bltouch.y_offset if printer.configfile.settings.bltouch.y_offset is defined else Y_OFFSET)|float %}
  {% endif %}
  {% if printer.configfile.config["probe"] is defined %}
    {% set X_OFFSET = (printer.configfile.config.probe.x_offset if printer.configfile.config.probe.x_offset is defined else X_OFFSET)|float %}
    {% set Y_OFFSET = (printer.configfile.config.probe.y_offset if printer.configfile.config.probe.y_offset is defined else Y_OFFSET)|float %}
  {% endif %}

  # bed_mesh boundaries calculations
  # bed_mesh_min and bed_mesh_max
  {% set BED_MESH_MIN_X = BED_MESH_MARGIN if X_OFFSET <= 0.0 else X_OFFSET + BED_MESH_MARGIN |float %}
  {% set BED_MESH_MIN_Y = BED_MESH_MARGIN if Y_OFFSET <= 0.0 else Y_OFFSET + BED_MESH_MARGIN |float %}
  {% set BED_MESH_MAX_X = X_MAX - (X_OFFSET)|abs - BED_MESH_MARGIN if X_OFFSET <= 0.0 else X_MAX - BED_MESH_MARGIN |float %}
  {% set BED_MESH_MAX_Y = Y_MAX - (Y_OFFSET)|abs - BED_MESH_MARGIN if Y_OFFSET <= 0.0 else Y_MAX - BED_MESH_MARGIN |float %}

  # Print values
  {action_respond_info("BED_MESH_MARGIN : %f" % (BED_MESH_MARGIN))}
  {action_respond_info("X_MAX           : %f" % (X_MAX))}
  {action_respond_info("Y_MAX           : %f" % (Y_MAX))}
  {action_respond_info("X_OFFSET        : %f" % (X_OFFSET))}
  {action_respond_info("Y_OFFSET        : %f" % (Y_OFFSET))}
  {action_respond_info("BED_MESH_MIN_X  : %f" % (BED_MESH_MIN_X))}
  {action_respond_info("BED_MESH_MIN_Y  : %f" % (BED_MESH_MIN_Y))}
  {action_respond_info("BED_MESH_MAX_X  : %f" % (BED_MESH_MAX_X))}
  {action_respond_info("BED_MESH_MAX_Y  : %f" % (BED_MESH_MAX_Y))}
  {action_respond_info("--- VALUES TO ADD OR UPDATE TO OUR BED_MESH VALUES ---")}
  {action_respond_info("--- VALORES PARA AGREGAR O ACTUALIZAR EN NUESTRA SECCIÓN BED_MESH ---")}
  {action_respond_info("mesh_max: %s,%s" % (BED_MESH_MAX_X,BED_MESH_MAX_Y))}
  {action_respond_info("mesh_min: %s,%s" % (BED_MESH_MIN_X,BED_MESH_MIN_Y))}