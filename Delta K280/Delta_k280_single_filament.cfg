# This file contains common pin mappings for MKS Robin Nano V2
# boards. To use this config, the firmware should be compiled for the
# STM32F103. When running "make menuconfig", enable "extra low-level
# configuration setup", select the 28KiB bootloader, and serial (on
# USART3 PB11/PB10) communication.

# Note that the "make flash" command does not work with MKS Robin
# boards. After running "make", run the following command:
#   ./scripts/update_mks_robin.py out/klipper.bin out/Robin_nano35.bin
# Copy the file out/Robin_nano35.bin to an SD card and then restart the
# printer with that SD card.

# See docs/Config_Reference.md for a description of parameters.

[include fluidd.cfg]

# Incluye la macro para calentar la impresora, iniciar la purga con 2 lineas, reiniciar el extrusor e iniciar la impresion
[include macros/START_PRINT.cfg]
[include macros/END_PRINT.cfg]
[include macros/DELTA_CALIBRACION.cfg]
[include macros/CALIBRATE_BED_MESH_PROBE.cfg]
[include macros/LED_PLUGIN.cfg]

# Macros inactivas
#[include resonancias.cfg]
#[include macros/TEST_SPEED_DELTA.cfg]
#[include macros/FILAMENT_LOAD_UNLOAD.cfg]
#[include macros/TOOL_CHANGE_EXTRUDER.cfg]
#[include macros/EXTRA_TOOLS.cfg]

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB2.0-Serial-if00-port0

#Configuracion de MKS Robin Nano V3
[printer]
kinematics: delta
max_velocity: 300
max_accel: 1500
max_z_velocity: 300
delta_radius: 179.34
delta_diagonal_rod: 335.0
delta_print_radius: 125.0

[delta_calibrate]
radius: 125
speed: 10
horizontal_move_z: 10

#Configuracion de ejes
[stepper_a]
step_pin: PE3
dir_pin: PE2
enable_pin: !PE4
microsteps: 16
rotation_distance: 40
endstop_pin: !PA15
homing_speed: 50
position_endstop: 400
arm_length: 335.0

[stepper_b]
step_pin: PE0
dir_pin: PB9
enable_pin: !PE1
microsteps: 16
rotation_distance: 40
endstop_pin: !PD2

[stepper_c]
step_pin: PB5
dir_pin: PB4
enable_pin: !PB8
microsteps: 16
rotation_distance: 40
endstop_pin: !PC8

[extruder]
step_pin: PD6
dir_pin: PD3
enable_pin: !PB3
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB4
sensor_type: ATC Semitec 104GT-2
sensor_pin: PK5
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250
min_extrude_temp: 10
max_extrude_only_distance: 1000
max_extrude_cross_section: 1000

[heater_bed]
heater_pin: PA0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC0
control: pid
min_temp: 0
max_temp: 110

[probe]
pin: ^PC8
z_offset:  0
y_offset: 0
x_offset: 0
speed: 10
samples: 3
sample_retract_dist: 10.0 # samples: 1
samples_result: median
#samples_result: average

[bed_mesh]
speed: 50                     # Speed for non-probing moves (default is fine)
horizontal_move_z: 10          # Height to move to before probing
mesh_radius: 125              # Radius of the mesh for round beds (matches your bed size)
mesh_origin: 0, 0             # Center of the mesh (relative to the probe)
round_probe_count: 10          # Number of points along the radius (higher for better accuracy)
fade_start: 0.5               # Start fading out Z-adjustment at this height
fade_end: 10.0                # Complete fading out at this height
fade_target: 0                # Converge fade to Z = 0 (homing position)
split_delta_z: 0.025          # Split moves if Z difference exceeds this value
move_check_distance: 10.0      # Distance to check for Z splits
mesh_pps: 10, 10                # Points per segment for interpolation
algorithm: bicubic            # Use bicubic interpolation for smoother transitions
bicubic_tension: 0.2          # Tension for bicubic interpolation (default is fine)
zero_reference_position: 0, 0 # Set Z = 0 at the center of the bed

[fan]
pin: PB1   # fan1

[heater_fan toolhead_fan]
pin: PB0 # fan2

[endstop_phase]

[input_shaper]

[gcode_macro CALIBRACION_CAMA]
description: Calibracion de cama
gcode:
      G28
      BED_MESH_CALIBRATE PROFILE="default"

[gcode_macro CALIBRACION_SONDA]
description: Calibracion de z_offset
gcode:
      G28
      PROBE_CALIBRATE

########################################
# TMC UART configuration
########################################

[tmc2209 stepper_a]
uart_pin: PD5
run_current: 0.7
stealthchop_threshold: 500000

[tmc2209 stepper_b]
uart_pin: PD7
run_current: 0.7
stealthchop_threshold: 500000

[tmc2209 stepper_c]
uart_pin: PD4
run_current: 0.7
stealthchop_threshold: 500000

[tmc2209 extruder]
uart_pin: PD9
run_current: 0.7
sense_resistor: 0.110
stealthchop_threshold: 500000

#Manual stepper en caso de agregar un sistema de extrusion dual
#Con 2 motores o con 1 solo
[tmc2209 manual_stepper]
uart_pin: PD8
run_current: 0.7
sense_resistor: 0.110
stealthchop_threshold: 500000