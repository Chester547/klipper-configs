[gcode_macro END_PRINT]
description: Macro to finish the print with LED control and initial setup
gcode:
    STOP_LED_EFFECTS
    SET_LED_EFFECT effect=sb_logo_homing
    M104 S0
    M140 S0
    M107
    G92 E0
    G1 E-10 F2000
    G28       
    STOP_LED_EFFECTS
    SET_LED_EFFECT effect=sb_logo_busy
    M84 ;

