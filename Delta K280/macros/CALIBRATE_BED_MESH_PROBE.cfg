[gcode_macro MALLADO_CAMA]
gcode:
    STOP_LED_EFFECTS
    SET_LED_EFFECT effect=sb_logo_homing
    G28
    STOP_LED_EFFECTS
    SET_LED_EFFECT effect=sb_logo_meshing
    BED_MESH_CALIBRATE PROFILE="default"
    STOP_LED_EFFECTS
    SET_LED_EFFECT effect=sb_logo_homing
    G28
    M84
    SET_LED_EFFECT effect=sb_logo_standby
    SAVE_CONFIG