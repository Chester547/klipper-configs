# This file contains common pin mappings for MKS Monster8
# boards. To use this config, the firmware should be compiled for the
# stm32f407. When running "make menuconfig", select the 48KiB
# bootloader, and enable "USB for communication".

# The "make flash" command does not work on the MKS Monster8. Instead,
# after running "make", copy the generated "out/klipper.bin" file to a
# file named "mks_monster8.bin" on an SD card or Udisk and then restart the
# MKS Monster8 with that SD card or Udisk.

# See docs/Config_Reference.md for a description of parameters.

[include macros/z_tilt.cfg]

#[include resonancias.cfg]

[include macros/START_PRINT.cfg]
[include macros/END_PRINT.cfg]

#[include macros/IDEX.cfg]

[include fluidd.cfg]

[virtual_sdcard]
path: /home/pi/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[printer]
kinematics: cartesian
#max_velocity: 300
#max_accel: 1500
#max_z_velocity: 15
#max_z_accel: 100

#max_velocity: 500
#max_accel: 2500
#max_z_velocity: 15
#max_z_accel: 100
#square_corner_velocity: 5.0

max_velocity: 500
max_accel: 1200
max_z_velocity: 15
max_z_accel: 100
minimum_cruise_ratio: 0.5
square_corner_velocity: 5.0

[stepper_x]
step_pin: PC14
dir_pin: PC13
enable_pin: !PC15
microsteps: 16
rotation_distance: 40
endstop_pin: !PA14  # PA13 for X-max; endstop have'!' is NO
position_endstop: -35
position_min: -35
position_max: 300
#homing_speed: 100
homing_speed: 150
second_homing_speed: 75

[stepper_y]
step_pin: PE5
dir_pin: !PE4
enable_pin: !PC15
microsteps: 16
rotation_distance: 40
endstop_pin: !PA15  # PC5 for Y-max; endstop have'!' is NO
position_endstop: -35
position_min: -35
position_max: 300
#homing_speed: 100
homing_speed: 150
second_homing_speed: 75

[stepper_z]
step_pin: PE1
dir_pin: PE0
enable_pin: !PE2
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -5
position_max: 400
#homing_speed: 10
homing_speed: 20
second_homing_speed: 10

[stepper_z1]
step_pin: PB5
dir_pin: PB4
enable_pin: !PB6
microsteps: 16
rotation_distance: 8

