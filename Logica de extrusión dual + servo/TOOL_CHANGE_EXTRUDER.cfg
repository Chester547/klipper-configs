# Considera agregar una sección de comprobación, si el filamento 1 esta cargado y se presiona T0
# Mostrar mensaje si la herramienta esta activa sino cambiar a la herramienta y mostrar mensaje de cambio, lo mismo para T1

[gcode_macro UNLOAD_T0]
description: Descarga el filamento del extrusor izquierdo
gcode:
    M117 Calentando hotend al minimo 180°
    SET_SERVO_POSITION SERVO=fil_select ANGLE=130 # Filamento 0 izquierdo
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=180
    M109 S180
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder0 MOTION_QUEUE=
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=extruder
    M117 Descargando filamento izquierdo
    UNLOAD_FILAMENT

[gcode_macro LOAD_T0]
description: Carga el filamento del extrusor izquierdo
gcode:
    SET_SERVO_POSITION SERVO=fil_select ANGLE=130 # Filamento 0 izquierdo
    M117 Calentando hotend al minimo 180°
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=180
    M109 S180
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder0 MOTION_QUEUE=
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=extruder
    M117 Cargando filamento izquierdo
    LOAD_FILAMENT
    SET_SERVO_POSITION SERVO=fil_select ANGLE=40 # Filamento 0 izquierdo
    M117 Liberando filamento izquierdo

[gcode_macro UNLOAD_T1]
description: Descarga el filamento del extrusor izquierdo
gcode:
    M117 Calentando hotend al minimo 180°
    SET_SERVO_POSITION SERVO=fil_select ANGLE=40 # Filamento 0 izquierdo
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=180
    M109 S180
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder
    M117 Descargando filamento izquierdo
    UNLOAD_FILAMENT

[gcode_macro LOAD_T1]
description: Carga el filamento del extrusor izquierdo
gcode:
    M117 Calentando hotend al minimo 180°
    SET_SERVO_POSITION SERVO=fil_select ANGLE=40 # Filamento 0 izquierdo
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=180
    M109 S180
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder
    M117 Cargando filamento izquierdo
    LOAD_FILAMENT
    SET_SERVO_POSITION SERVO=fil_select ANGLE=130 # Filamento 0 izquierdo
    M117 Liberando filamento derecho