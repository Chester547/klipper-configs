[gcode_macro START_PRINT]
description: Macro to start the print with LED control and initial setup
variable_BED_TEMP: 60
variable_EXTRUDER_TEMP: 200
gcode:
    # Preparar la impresora
    STOP_LED_EFFECTS
    SET_LED_EFFECT effect=sb_nozzle_heating
    #LUCES EN ESPERA
    STOP_LED_EFFECTS
    SET_LED_EFFECT effect=sb_logo_busy
    G92 E0 ; Reset Extruder
    STOP_LED_EFFECTS
    SET_LED_EFFECT effect=sb_logo_homing
    G28 ; Home all axes
    STOP_LED_EFFECTS

    G90 ; Use absolute positioning
    
    SET_LED_EFFECT effect=sb_logo_calibrating_z
    Z_TILT_ADJUST ; Adjust the bed tilt
    STOP_LED_EFFECTS
    SET_LED_EFFECT effect=sb_logo_homing
    G28 ; Home all axes again
    STOP_LED_EFFECTS
    SET_LED_EFFECT effect=sb_logo_meshing
    BED_MESH_PROFILE LOAD=default ; Load the default bed mesh profile
    STOP_LED_EFFECTS
    SET_LED_EFFECT effect=sb_logo_printing
    SET_LED_EFFECT effect=set_nozzle_leds
    
    # Move platform and start initial extrusion
    G1 Z15.0 F2000 ; Move the platform
    G1 X10 Y20 Z0.5 F5000.0 ; Move to start position
    G1 X10 Y150.0 Z0.5 F1500.0 E15 ; Draw the first line
    G92 E0 ; Reset Extruder
    G1 Z2.0 F3000 ; Move Z Axis up little to prevent scratching of Heat Bed
