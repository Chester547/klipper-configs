[neopixel case_led]  # Nombre del dispositivo (puedes cambiarlo)
pin: ender_board:PA13        # Pin de la Raspberry Pi conectado al LED
chain_count: 3     # Número de LEDs en la tira (1 si es solo el del case)
color_order: GRB   # Orden de color común en WS2812B (puede variar)
initial_RED: 0.5   # Brillo inicial (opcional, ajusta según necesites)
initial_GREEN: 0.5
initial_BLUE: 0.5

[led_effect rainbow_case]
leds:
    neopixel:case_led
autostart:                          true
frame_rate:                         24
layers:
    gradient  0.3  1 add (0.3, 0.0, 0.0),(0.0, 0.3, 0.0),(0.0, 0.0, 0.3)