
[mcu ender_board]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0    # Run ls /dev/serial/by-id/* for micro-controller name
restart_method: command

[stepper_z]
step_pin: ender_board:PC2
dir_pin: ender_board:PB9
enable_pin: !ender_board:PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -5
position_max: 200

[tmc2208 stepper_z]
uart_pin: ender_board:PB6
run_current: 0.580
stealthchop_threshold: 999999

[stepper_z1]
step_pin: ender_board:PB8
dir_pin: !ender_board:PB7
enable_pin: !ender_board:PC3
microsteps: 16
rotation_distance: 8

[tmc2208 stepper_z1]
uart_pin: ender_board:PB5
run_current: 0.580
stealthchop_threshold: 999999

[bed_screws]
screw1: 33,40
screw2: 273,40
screw3: 273,281
screw4: 33,281

[screws_tilt_adjust]
screw1: 9, -2
screw2: 249,-2
screw3: 249,230
screw4: 9,230
screw1_name: front left
screw2_name: front right
screw3_name: rear right
screw4_name: rear left
screw_thread: CW-M4
horizontal_move_z: 10
speed: 50

[controller_fan board_fan]
pin: ender_board:PA0