##################
## BETA VERSION ##
##################

########################
## Basic instructions ##
########################

#With this config you will set the probe as your z endstop. This makes the initial setup a bit more tricky than with the Rev1.
#The printer will set you bed position as Z0 (because it probes on that).
#You have to roughtly position the Probe_Retainer for the first setup before you can set the final position. The !top! of the arm has to be roughtly 1mm above the bed.
#To find the perfect position of the Probe_Retainer you have to home the z axis. After this the probe will be at the new Z0 position.
#Place the Probe_Retainer close to the block so there's just a small gap between them.
#since this uses the KlickyPCB you have the option of wiring up the LED to 5V make sure to wire your probe correctly

##Attention!##
#Youre using the Probe as your Z endstop. This means that the position Z0 is also affected by your Z offset.
#Keeep that in mind when positioning the Probe_Retainer
#You might have to change the position of the Probe_Retainer after you set your z offset (0.x mm changes wouldn't changes that much but for everything >1mm you should check its positioning).
#And a kindly reminder to adapt the [probe] pin, set the virtual endstop, set the y min posistion.

##################################
## Add this to your printer.cfg ##
################################## 
#####################################################################
#	KlackEnder- Settings
#####################################################################

# !! Change your Z endstop pin from 'endstop_pin: Pin123' to 'endstop_pin: probe:z_virtual_endstop'
# !! Also add in [stepper_y] 'position_min: -8'. Idk why but most configs mave this wrong. For the Stock Ender 3 the homed Y position is -8.

[probe]
pin: ^PC8 #CHANGE ME TO YOUR Z endstop or probe pin
z_offset: 4.22 #Measure per your specific setup
x_offset: 24
y_offset: 42 # negative = in front of of the nozzle
speed: 5.0
lift_speed: 15.0
sample_retract_dist: 1
samples: 3
samples_tolerance_retries: 6

[bed_mesh]
speed: 50
horizontal_move_z: 5

#mesh_min: 10.0,10.0
#mesh_max: 270.0, 290.0

# Klicky pcb - Klackender
mesh_min: 14.0,27.0
mesh_max: 295.0,290.0

fade_start: 0.6
fade_end: 10.0
probe_count: 6, 6

[homing_override]
axes: z
set_position_z: 0  # Make printer think Z axis is at zero, so we can force a move upwards away from build plate
gcode:
    G90
    G1 Z10 F3000 ; Move up to prevent accidentally scratching the build plate
    
    {% if "x" not in (printer.toolhead.homed_axes | lower) %}
        G28 X ; Home X axis if not already homed
    {% endif %}
    {% if "y" not in (printer.toolhead.homed_axes | lower) %}
        G28 Y ; Home Y axis if not already homed
    {% endif %}
    
    PROBE_OUT ; Move the probe out
    G1 X127.5 Y112 F6000 ; Move to the probing position
    G28 Z ; Home Z axis
    PROBE_IN ;

##For Dual Z setups only!! (with independent motors on INDEPENDENT drivers ONLY, NO Y splitters or dual Z port on board!)##
[z_tilt]
z_positions:
    -25,150  # 80.0 mm outside of the outer edges on both sides
    310,150
#   A list of X, Y coordinates (one per line; subsequent lines
#   indented) describing the location of each bed "pivot point". The
#   "pivot point" is the point where the bed attaches to the given Z
#   stepper. It is described using nozzle coordinates (the X, Y position
#   of the nozzle if it could move directly above the point). The
#   first entry corresponds to stepper_z, the second to stepper_z1,
#   the third to stepper_z2, etc. This parameter must be provided.

# Center points
points:
    36, 83
    216, 83
    216, 133
    36, 133
    36, 183
    216, 183

speed: 100
#   The speed (in mm/s) of non-probing moves during the calibration.
#   The default is 50.
horizontal_move_z: 15
#   The height (in mm) that the head should be commanded to move to
#   just prior to starting a probe operation. The default is 5.
retries: 10
#   Number of times to retry if the probed points aren't within
#   tolerance.
retry_tolerance: 0.5
#   If retries are enabled then retry if largest and smallest probed
#   points differ more than retry_tolerance. Note the smallest unit of
#   change here would be a single step. However if you are probing
#   more points than steppers then you will likely have a fixed
#   minimum value for the range of probed points which you can learn
#   by observing command output.

#####################################################################
#	KlackEnder- Macros
#####################################################################
[gcode_macro PROBE_OUT]
gcode:
    G90
    G1 X303 F4000
    G4 P300
    G1 Z20
    G1 X0

[gcode_macro PROBE_IN]
gcode:
    G90
    G1 Z20
    G1 X303 F5000
    G28 Y #Check this against your config of [stepper_y] position_min: ...!
    G1 Z0
    G4 P300
    G1 X220 F5000
    G1 Z10
    G1 X0

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _BED_MESH_CALIBRATE
gcode:
    PROBE_OUT
    _Z_TILT_ADJUST
    _BED_MESH_CALIBRATE
    PROBE_IN

[gcode_macro G29]
gcode:
    PROBE_OUT
    _Z_TILT_ADJUST
    _BED_MESH_CALIBRATE
    PROBE_IN

[gcode_macro PROBE_CALIBRATE]
rename_existing: _PROBE_CALIBRATE
gcode:
    {% if not 'xyz' in printer.toolhead.homed_axes %}
    G28
    {% endif %}
    PROBE_OUT
    G90
    G1 Z20
    G1 X115 Y115 F20000
    _PROBE_CALIBRATE
    TESTZ Z=20
    M117 Remove the Klack to continue calibration!

[gcode_macro PROBE_ACCURACY]
rename_existing: _PROBE_ACCURACY
gcode:
    {% if not 'xyz' in printer.toolhead.homed_axes %}
    G28
    {% endif %}
    PROBE_OUT
    G90
    G1 Y115 X115 F20000
    _PROBE_ACCURACY
    PROBE_IN

[gcode_macro Z_TILT_ADJUST]
rename_existing: _Z_TILT_ADJUST
gcode:
    PROBE_OUT
    _Z_TILT_ADJUST
    PROBE_IN

[gcode_macro SCREWS_TILT_CALCULATE]
rename_existing: _SCREWS_TILT_CALCULATE
gcode:
    PROBE_OUT
    _SCREWS_TILT_CALCULATE
    PROBE_IN