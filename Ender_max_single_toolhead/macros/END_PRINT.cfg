[gcode_macro END_PRINT]
description: Macro to finish the print with LED control and initial setup
gcode:
    STOP_EFFECT
    SET_LED_EFFECT EFFECT=sb_logo_part_ready
    TURN_OFF_HEATERS
    M106 S0
    G92 E0
    G1 E-10 F2000
    G28 X0
    G1 Y200 F2000
    M84
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=rainbow
