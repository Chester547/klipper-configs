[gcode_macro Z_TILT_AREA]
description: Mide la inclinación de la cama en varios puntos y calcula la inclinación.
gcode:
    G28 ; Home all axes
    G90 ; Set to absolute positioning
    
    # Definir el tamaño máximo del área de trabajo y los offsets de la sonda
    {% set max_x = 290 %}
    {% set max_y = 250 %}
    {% set x_offset = 45.5 %}
    {% set y_offset = 12 %}
    
    # Definir puntos de medición ajustados por los offsets de la sonda
    {% set points = [
        {'x': x_offset, 'y': y_offset},
        {'x': x_offset, 'y': max_y - y_offset},
        {'x': max_x - x_offset, 'y': y_offset},
        {'x': max_x - x_offset, 'y': max_y - y_offset}
    ] %}
    
    # Lista para almacenar alturas medidas
    {% set heights = [] %}
    
    # Moverse a cada punto y medir altura
    {% for point in points %}
        G1 X{point.x} Y{point.y} F6000 ; Moverse al punto
        G1 Z10 ; Levantar para asegurar que no hay colisión
        PROBE ; Medir la altura en el punto (ajusta esto según tu impresora y configuración del sensor)
        {% set heights = heights + [printer.probe.last_z_result] %}
        M117 Altura medida en ({point.x}, {point.y}): {printer.probe.last_z_result}
    {% endfor %}
    
    # Calcular diferencias de altura
    {% set tilt_x = heights[1] - heights[0] %}
    {% set tilt_y = heights[2] - heights[0] %}
    
    M117 Inclinación en X: {tilt_x}
    M117 Inclinación en Y: {tilt_y}
    G28

[z_tilt]
z_positions:
    -32,132  # 80.0 mm outside of the outer edges on both sides
    320.0,132
#   A list of X, Y coordinates (one per line; subsequent lines
#   indented) describing the location of each bed "pivot point". The
#   "pivot point" is the point where the bed attaches to the given Z
#   stepper. It is described using nozzle coordinates (the X, Y position
#   of the nozzle if it could move directly above the point). The
#   first entry corresponds to stepper_z, the second to stepper_z1,
#   the third to stepper_z2, etc. This parameter must be provided.

# Center points
points:
    44.5, 70
    170, 70
    170, 150
    44.5, 150
    44.5, 230
    170, 230

# points:
#    85, 60
#    275, 60
#    275, 120
#    85, 120
#    85, 180
#    275, 180

#   A list of X, Y coordinates (one per line; subsequent lines
#   indented) that should be probed during a Z_TILT_ADJUST command.
#   Specify coordinates of the nozzle and be sure the probe is above
#   the bed at the given nozzle coordinates. This parameter must be
#   provided.
speed: 25
#   The speed (in mm/s) of non-probing moves during the calibration.
#   The default is 50.
horizontal_move_z: 10
#   The height (in mm) that the head should be commanded to move to
#   just prior to starting a probe operation. The default is 5.
retries: 3
#   Number of times to retry if the probed points aren't within
#   tolerance.
retry_tolerance: 0.8
#   If retries are enabled then retry if largest and smallest probed
#   points differ more than retry_tolerance. Note the smallest unit of
#   change here would be a single step. However if you are probing
#   more points than steppers then you will likely have a fixed
#   minimum value for the range of probed points which you can learn
#   by observing command output.